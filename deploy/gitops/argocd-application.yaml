apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gamesense
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_OWNER/gamesense.git
    targetRevision: main
    path: deploy/helm/gamesense
  destination:
    server: https://kubernetes.default.svc
    namespace: gamesense
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
