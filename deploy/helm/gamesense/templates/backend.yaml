apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamesense-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: { app: gamesense-backend }
  template:
    metadata:
      labels: { app: gamesense-backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
          livenessProbe: { httpGet: { path: /health, port: 8000 } }
---
apiVersion: v1
kind: Service
metadata:
  name: gamesense-backend
spec:
  selector: { app: gamesense-backend }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
