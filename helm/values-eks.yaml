# EKS capstone overlay, layered on values.yaml by Argo CD (deploy/gitops).
# CI rewrites both image tags to the published commit SHA on every push to main.
# Cluster prerequisites created outside Git: the ghcr-pull and gamesense-database
# Secrets, and the gamesense-content-bundle ConfigMap (see "Kubernetes deployment" in README.md).
imageRegistry: ghcr.io
imagePullSecrets:
  - name: ghcr-pull

frontend:
  replicaCount: 2
  image:
    repository: ndgcodes/gamesense-frontend
    tag: d31ba7d
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}

backend:
  replicaCount: 2
  image:
    repository: ndgcodes/gamesense-backend
    tag: d31ba7d
  recommender:
    mode: content
    contentBundle:
      configMapName: gamesense-content-bundle
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

ingress:
  # IngressClass created by the Traefik release named gamesense-ingress.
  className: gamesense-ingress-traefik
  host: ""
  annotations:
    # Remove the chart's default ALB annotation; Traefik serves this Ingress.
    alb.ingress.kubernetes.io/scheme: null
