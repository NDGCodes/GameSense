{{- if and (gt (int .Values.backend.replicaCount) 1) (empty .Values.backend.database.urlSecretName) -}}
{{- fail "backend.database.urlSecretName is required for multiple backend replicas; configure a shared PostgreSQL DATABASE_URL" -}}
{{- end -}}
{{- $fixture := and .Values.backend.recommender.contentFixture.configMap.create (eq .Values.backend.recommender.mode "content") -}}
{{- $bundle := .Values.backend.recommender.contentBundle -}}
{{- $useBundle := and $bundle.configMapName (eq .Values.backend.recommender.mode "content") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gamesense.fullname" . }}-backend
  labels:
    {{- include "gamesense.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "gamesense.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "gamesense.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        {{- toYaml .Values.backend.podAnnotations | nindent 8 }}
        {{- if $fixture }}
        checksum/content-fixture: {{ .Files.Get .Values.backend.recommender.contentFixture.chartFile | sha256sum | quote }}
        {{- end }}
        {{- if and $useBundle $bundle.checksum }}
        checksum/content-bundle: {{ $bundle.checksum | quote }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "gamesense.image" (dict "registry" .Values.imageRegistry "repository" .Values.backend.image.repository "tag" .Values.backend.image.tag) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: GAMESENSE_ENV
              value: {{ .Values.backend.env.GAMESENSE_ENV | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.backend.env.CORS_ALLOWED_ORIGINS | quote }}
            - name: RECOMMENDER_MODE
              value: {{ .Values.backend.recommender.mode | quote }}
            - name: CONTENT_FIXTURE_PATH
              value: {{ .Values.backend.recommender.contentFixture.mountPath | quote }}
            {{- if $useBundle }}
            - name: CONTENT_BUNDLE_PATH
              value: {{ $bundle.mountPath | quote }}
            {{- end }}
            {{- if .Values.backend.database.urlSecretName }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.urlSecretName | quote }}
                  key: {{ .Values.backend.database.urlSecretKey | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readinessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.livenessPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if or $fixture $useBundle }}
          volumeMounts:
            {{- if $fixture }}
            - name: content-fixture
              mountPath: {{ .Values.backend.recommender.contentFixture.mountPath | quote }}
              subPath: {{ .Values.backend.recommender.contentFixture.fileName | quote }}
              readOnly: true
            {{- end }}
            {{- if $useBundle }}
            - name: content-bundle
              mountPath: {{ $bundle.mountPath | quote }}
              subPath: {{ $bundle.fileName | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $fixture $useBundle }}
      volumes:
        {{- if $fixture }}
        - name: content-fixture
          configMap:
            name: {{ default (printf "%s-content-fixture" (include "gamesense.fullname" .)) .Values.backend.recommender.contentFixture.configMap.name | quote }}
        {{- end }}
        {{- if $useBundle }}
        - name: content-bundle
          configMap:
            name: {{ $bundle.configMapName | quote }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gamesense.fullname" . }}-backend
  labels:
    {{- include "gamesense.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "gamesense.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
