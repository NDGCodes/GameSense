# Optional overrides for local clusters where images are preloaded instead of pulled from GHCR.
imageRegistry: ""

frontend:
  image:
    repository: gamesense-frontend
    tag: local
    pullPolicy: IfNotPresent

backend:
  image:
    repository: gamesense-backend
    tag: local
    pullPolicy: IfNotPresent

ingress:
  enabled: false
