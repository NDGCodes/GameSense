nameOverride: ""
fullnameOverride: ""

imageRegistry: ghcr.io
imagePullSecrets: []

frontend:
  replicaCount: 2
  image:
    repository: ndgcodes/gamesense-frontend
    tag: b449401
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources: {}

backend:
  replicaCount: 2
  image:
    repository: ndgcodes/gamesense-backend
    tag: b449401
    pullPolicy: IfNotPresent
  env:
    GAMESENSE_ENV: kubernetes
    CORS_ALLOWED_ORIGINS: https://gamesense.example.com,http://localhost:5173,http://localhost:3000
  recommender:
    # Keep fixture mode as the deployment default. Set to "content" only for a
    # clearly labeled baseline smoke deployment; it uses the self-authored sample
    # fixture below and does not claim real-catalog or production performance.
    mode: fixture
    contentFixture:
      # Path consumed by backend/app/recommender_service.py when mode is "content".
      mountPath: /app/data/fixtures/ml/sample_games.self-authored.json
      fileName: sample_games.self-authored.json
      chartFile: artifacts/sample_games.self-authored.json
      configMap:
        # When mode is "content", create and mount a ConfigMap containing the
        # committed self-authored sample fixture. Disable only if the image or an
        # externally managed volume already provides mountPath.
        create: true
        name: ""
    contentBundle:
      # Optional externally created ConfigMap holding a validated content bundle zip
      # (binaryData key fileName). Used only when mode is "content"; the bundle is
      # private data and is never committed or rendered from the chart.
      configMapName: ""
      fileName: content-bundle.zip
      mountPath: /app/data/bundle/content-bundle.zip
      # Set to the bundle's SHA-256 so pods roll when the ConfigMap content changes.
      checksum: ""
  database:
    # Create this Kubernetes Secret separately for the shared database.
    # The secret value should be a SQLAlchemy DATABASE_URL such as postgresql+pg8000://...
    urlSecretName: gamesense-database
    urlSecretKey: DATABASE_URL
  service:
    type: ClusterIP
    port: 8000
  probes:
    livenessPath: /health
    readinessPath: /ready
  resources: {}
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics

ingress:
  enabled: true
  className: alb
  host: gamesense.example.com
  pathType: Prefix
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
  tls: []
