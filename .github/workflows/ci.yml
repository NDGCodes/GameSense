name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests and migration check
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

      - name: ML data-pipeline and recommender focused tests
        run: |
          cd backend
          pytest -q tests/test_ml_pipeline.py tests/test_recommender.py tests/test_api.py

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Docker Compose config check
        run: docker compose config --quiet

      - name: Docker Compose content recommender smoke test
        run: docker compose --profile content-smoke run --rm content-smoke

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format and validate
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint and render
        run: |
          helm lint deploy/helm/gamesense
          helm template gamesense deploy/helm/gamesense >/tmp/gamesense-rendered.yaml

  container-security:
    runs-on: ubuntu-latest
    needs: validate-foundation
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: gamesense-${{ matrix.service }}:${{ github.sha }}

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gamesense-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  publish-images:
    runs-on: ubuntu-latest
    needs: [validate-foundation, container-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          repo=$(basename '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${repo}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
