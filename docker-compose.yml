services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamesense
      POSTGRES_USER: gamesense
      POSTGRES_PASSWORD: gamesense
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamesense -d gamesense"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+pg8000://gamesense:gamesense@db:5432/gamesense
      GAMESENSE_ENV: local
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      CONTENT_FIXTURE_PATH: /app/data/fixtures/ml/sample_games.self-authored.json
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  content-smoke:
    profiles: ["content-smoke"]
    build: ./backend
    environment:
      RECOMMENDER_MODE: content
      CONTENT_FIXTURE_PATH: /app/data/fixtures/ml/sample_games.self-authored.json
    volumes:
      - ./data:/app/data:ro
    command: >
      python -c "from app.recommender_service import recommend_for_api;
      result = recommend_for_api(None, mode='cozy', favorite_game='Moonlit Market');
      assert result.algorithm == 'content-baseline-rrf';
      assert result.catalogItems == 2;
      assert result.recommendations and result.recommendations[0].source == 'gamesense-self-authored-smoke-fixture';
      print('content recommender smoke passed')"

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
